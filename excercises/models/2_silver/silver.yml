version: 2

models:

  # ---------------------------------------------------------------------------
  # DIMENSIONS
  # ---------------------------------------------------------------------------

  - name: dim_patient
    description: >
      One row per patient. Grain: one patient entity identified by contact_id
      (the business key from HubSpot Contacts). Rebuilt from scratch on every
      run (SCD Type 1) — historical changes are not preserved at this layer.
      In Module 10, this model is extended into a Type 2 snapshot variant
      (dim_patient_scd2) to track change history.
    columns:
      - name: patient_key
        description: >
          Surrogate primary key. MD5 hash of contact_id, generated by
          dbt_utils.generate_surrogate_key. Used as the join key in all
          downstream fact tables.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: contact_id
        description: >
          Business key from HubSpot Contacts (source column: id). Uniquely
          identifies a patient within HubSpot. Never reassigned by the source
          system.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: first_name
        description: "Patient's first name as stored in HubSpot."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: last_name
        description: "Patient's last name as stored in HubSpot."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: email
        description: >
          Patient's primary email address from HubSpot. Used as a
          human-readable identifier in reporting alongside contact_id.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: country_code
        description: >
          ISO 3166-1 alpha-2 country code (e.g. DE, AT, CH). Upper-cased and
          trimmed in staging. Null when the patient record has no country set
          in HubSpot.

      - name: pipeline_stage_id
        description: >
          Business key of the HubSpot pipeline stage the contact is currently
          assigned to. Foreign key to dim_pipeline_stage.pipeline_stage_id.
          Populated by HubSpot's CRM pipeline workflow.
        data_tests:
          - relationships:
              to: ref('dim_pipeline_stage')
              field: pipeline_stage_id
              config:
                severity: warn

      - name: created_at
        description: >
          Timestamp when the contact record was first created in HubSpot.
          Carried through from the source without modification; timezone-aware
          (TIMESTAMP_TZ on Snowflake).
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: updated_at
        description: >
          Timestamp of the most recent update to the contact record in HubSpot.
          Used in Module 10 as the basis for snapshot change detection.


  # ---------------------------------------------------------------------------

  - name: dim_doctor
    description: >
      One row per doctor. Grain: one doctor entity identified by doctor_id
      (the business key from HubSpot Owners). Rebuilt from scratch on every
      run (SCD Type 1). This model depends on stg_hubspot__owners, which
      participants implement during Module 05. It cannot be built before that
      staging model is complete.
    columns:
      - name: doctor_key
        description: >
          Surrogate primary key. MD5 hash of owner_id (renamed to doctor_id in
          staging), generated by dbt_utils.generate_surrogate_key. Used as the
          join key in fct_prescription.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: doctor_id
        description: >
          Business key from HubSpot Owners (source column: owner_id). Uniquely
          identifies a doctor within HubSpot. Renamed at the staging layer to
          reflect the business domain (doctor vs. generic owner).
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: first_name
        description: "Doctor's first name as stored in HubSpot Owners."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: last_name
        description: "Doctor's last name as stored in HubSpot Owners."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: email
        description: >
          Doctor's work email address from HubSpot Owners. Used as a
          human-readable identifier in reporting.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: loaded_at
        description: >
          Timestamp when the owner record was last loaded from the source into
          the bronze/staging layer. Reflects ingestion time, not the time the
          doctor record changed in HubSpot.


  # ---------------------------------------------------------------------------

  - name: dim_pipeline_stage
    description: >
      One row per HubSpot pipeline stage. Grain: one stage entity identified
      by pipeline_stage_id (business key from HubSpot Pipeline Stages). Rebuilt
      from scratch on every run. Stages are relatively static reference data —
      new stages are added infrequently and existing stages are rarely renamed.
      Used by fct_deal (not yet on this branch) and referenced by dim_patient
      via pipeline_stage_id.
    columns:
      - name: pipeline_stage_key
        description: >
          Surrogate primary key. MD5 hash of pipeline_stage_id, generated by
          dbt_utils.generate_surrogate_key. Used as the join key in downstream
          fact tables.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: pipeline_stage_id
        description: >
          Business key from HubSpot Pipeline Stages (source column: stage_id).
          Uniquely identifies a stage within HubSpot.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: stage_name
        description: >
          Human-readable name of the pipeline stage as configured in HubSpot
          (e.g. "New Lead", "Qualified", "Closed Won").
        data_tests:
          - not_null:
              config:
                severity: error

      - name: pipeline_id
        description: >
          Identifier of the parent HubSpot pipeline this stage belongs to.
          A pipeline groups an ordered sequence of stages. One pipeline can
          contain multiple stages.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: sort_order
        description: >
          Integer position of this stage within its pipeline. Determines the
          display order in HubSpot and can be used to sequence stages in
          reporting (e.g. funnel visualisations).

      - name: probability
        description: >
          Deal win probability (0.0–1.0) assigned to this stage in HubSpot.
          Used for weighted pipeline calculations. Cast to DOUBLE in staging.

      - name: is_closed
        description: >
          True when this stage represents a terminal state (deal closed — either
          won or lost). False for all active/in-progress stages. Cast to BOOLEAN
          in staging.
        data_tests:
          - not_null:
              config:
                severity: error


  # ---------------------------------------------------------------------------
  # FACTS
  # ---------------------------------------------------------------------------

  - name: fct_prescription
    description: >
      One row per prescription event. Grain: one prescription record identified
      by prescription_id (business key from the prescriptions source table).
      Each row captures a single medication dispensing event linking a patient
      to a prescribing doctor. This is the primary fact table at the Silver layer
      and the foundation for prescription volume, fill rate, and dosage reporting
      in the Gold layer.

      Note for Module 06: this model contains a deliberate bug — patient_key and
      doctor_key are swapped in the SQL (reversed aliases). The relationship tests
      defined below are intentionally written with the CORRECT semantics so they
      will catch the bug and fail. Fixing the reversed aliases is the hands-on
      exercise for the testing module.
    columns:
      - name: prescription_key
        description: >
          Surrogate primary key. MD5 hash of prescription_id, generated by
          dbt_utils.generate_surrogate_key.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: prescription_id
        description: >
          Business key from the prescriptions source table. Uniquely identifies
          a single prescription event within the source system.
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: patient_key
        description: >
          Foreign key to dim_patient.patient_key. Identifies the patient who
          received the prescription. Resolved from stg_prescriptions.contact_id
          via a join to dim_patient.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('dim_patient')
              field: patient_key
              config:
                severity: error

      - name: doctor_key
        description: >
          Foreign key to dim_doctor.doctor_key. Identifies the doctor who issued
          the prescription. Resolved from stg_prescriptions.owner_id via a join
          to dim_doctor.
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: ref('dim_doctor')
              field: doctor_key
              config:
                severity: error

      - name: prescription_date
        description: >
          Calendar date on which the prescription was issued by the doctor.
          Source type is DATE — no time component. Used as the primary date
          dimension join key in Gold-layer reporting.
        data_tests:
          - not_null:
              config:
                severity: error

      - name: medication_type
        description: >
          Delivery form of the prescribed medication as recorded in the source
          system (e.g. tablet, liquid, injection, topical). Free-text in the
          source — values should be verified and an accepted_values test added
          once the distinct values are confirmed from the seed data.

      - name: dosage_amount
        description: >
          Prescribed dose quantity in the unit defined by the medication type.
          Null when the prescribing doctor has not yet confirmed the dose —
          this is a valid state for newly created prescription records.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: notes
        description: >
          Optional free-text clinical notes added by the doctor at the time of
          prescribing. Not structured — no tests applied. Null is expected and
          normal.

      - name: quantity
        description: >
          Number of units prescribed (e.g. number of tablets, vials, or doses).
          Integer. Used as a measure in prescription volume calculations.
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: created_at
        description: >
          Timestamp when the prescription record was created in the source
          system. Timezone-aware (TIMESTAMP_TZ on Snowflake). Not the same as
          prescription_date — a prescription can be created in the system
          before or after the actual dispensing date.
        data_tests:
          - not_null:
              config:
                severity: warn
